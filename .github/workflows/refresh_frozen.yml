name: Historical LSTM ONNX inputs and Pages
on:
  schedule:
    - cron: '25 20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-lstm-pages
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/main' && vars.BRENT_DATA_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion; never train or export weights
        run: python -m pip install -e .
      - name: Download and validate 60x16 inputs
        run: python -m scripts.prepare_pages_data
      - name: Publish minimal tree only for a newer valid origin
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_origin="$(gh api "repos/${GITHUB_REPOSITORY}/contents/assets/data/latest.json?ref=gh-pages" --jq .content 2>/dev/null | base64 -d | python -c 'import json,sys; print(json.load(sys.stdin)["origin"]["date"])' 2>/dev/null || true)"
          local_origin="$(python -c 'import json; print(json.load(open("web/pages/assets/data/latest.json"))["origin"]["date"])')"
          if test -n "$remote_origin" && { test "$local_origin" = "$remote_origin" || test "$local_origin" \< "$remote_origin"; }; then
            echo 'No newer valid origin. Nothing published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh auth setup-git
          publication="$RUNNER_TEMP/historical-lstm-pages"
          mkdir -p "$publication"
          git -C "$publication" init
          git -C "$publication" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$publication" fetch --depth=1 origin gh-pages; then
            git -C "$publication" checkout -B gh-pages FETCH_HEAD
          else
            git -C "$publication" checkout --orphan gh-pages
          fi
          cp -R web/pages/. "$publication/"
          rm -f "$publication/assets/demo-state.json"
          cd "$publication"
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "data: validated historical LSTM inputs $local_origin"
          git push origin HEAD:gh-pages
          echo "Published valid origin $local_origin, no training." >> "$GITHUB_STEP_SUMMARY"
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.published == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.published == 'true'
        with:
          path: ${{ runner.temp }}/historical-lstm-pages
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.publish.outputs.published == 'true'
