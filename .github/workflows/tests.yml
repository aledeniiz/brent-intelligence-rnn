name: Python tests and synthetic end-to-end
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q brent_intelligence scripts tests app.py
      - name: Temporal and end-to-end tests
        run: python -m pytest -q
      - name: CLI check
        run: |
          python -m scripts.train_models --help
          python -m scripts.download_data --help

      - name: Real FRED end-to-end smoke (NOT benchmark evidence)
        run: |
          python -m scripts.download_data --fred-only
          python -m scripts.train_models --smoke --epochs 1 --hidden-size 8 > /dev/null
          test ! -f artifacts/active.json
  official-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight data audit dependencies
        run: python -m pip install pandas numpy
      - name: Fetch Brent and FRED indicators
        run: python -m scripts.download_data --fred-only
      - name: Audit official CSV
        run: python -m scripts.audit_data
